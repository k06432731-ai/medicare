name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'medicare-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'medicare-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medicare-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: medicare-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin panel
        run: npm run build

      - name: Lint (if configured)
        run: |
          if npm run | grep -qE '^\s*lint'; then
            npm run lint
          else
            echo "No lint script — skipping."
          fi
